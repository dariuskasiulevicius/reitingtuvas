name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUTDIR="dist/reitingtuvas-${GOOS}-${GOARCH}"
          mkdir -p "${OUTDIR}"
          go build -ldflags "-X main.version=${VERSION}" \
            -o "${OUTDIR}/reitingtuvas${{ matrix.ext }}" \
            ./cmd/reitingtuvas
          cp docs/naudotojo-gidas.md "${OUTDIR}/" 2>/dev/null || true
      - name: Archive
        run: |
          cd dist
          DIRNAME="reitingtuvas-${{ matrix.goos }}-${{ matrix.goarch }}"
          zip -r "${DIRNAME}.zip" "${DIRNAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: reitingtuvas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
